<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Capteurs IoT</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 20px;
        background: #f4f7fb;
        color: #222;
      }
      h1 {
        text-align: center;
      }
      .dashboard {
        display: grid;
        grid-template-columns: repeat(2, minmax(320px, 1fr));
        gap: 20px;
      }
      .panel {
        background: white;
        border-radius: 12px;
        padding: 18px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      }
      .stat {
        display: flex;
        justify-content: space-between;
        margin-bottom: 12px;
        padding: 8px 10px;
        background: #eef5ff;
        border-radius: 8px;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 10px;
      }
      th, td {
        border-bottom: 1px solid #dfe8f3;
        text-align: center;
        padding: 8px;
      }
      canvas {
        width: 100% !important;
        height: 260px !important;
        margin-top: 10px;
      }
      .error {
        color: #b00020;
        background: #ffe6ea;
        padding: 10px 12px;
        border-radius: 8px;
        margin: 10px 0;
        display: none;
      }
      @media (max-width: 800px) {
        .dashboard {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <h1>Capteurs de température et humidité</h1>
    <div id="error" class="error"></div>
    <div class="dashboard">
      <section class="panel" id="temp-panel">
        <h2>Température</h2>
        <div class="stat"><span>Actuelle</span> <strong id="temp-current">--</strong></div>
        <div class="stat"><span>Moyenne des 30 dernières</span> <strong id="temp-average">--</strong></div>
        <h3>Historique des 30 dernières valeurs</h3>
        <table>
          <thead>
            <tr><th>Timestamp</th><th>Valeur</th></tr>
          </thead>
          <tbody id="temp-history"></tbody>
        </table>
        <canvas id="temp-chart"></canvas>
      </section>

      <section class="panel" id="hum-panel">
        <h2>Humidité</h2>
        <div class="stat"><span>Actuelle</span> <strong id="hum-current">--</strong></div>
        <div class="stat"><span>Moyenne des 30 dernières</span> <strong id="hum-average">--</strong></div>
        <h3>Historique des 30 dernières valeurs</h3>
        <table>
          <thead>
            <tr><th>Timestamp</th><th>Valeur</th></tr>
          </thead>
          <tbody id="hum-history"></tbody>
        </table>
        <canvas id="hum-chart"></canvas>
      </section>
    </div>

    <script>
      const BACKEND = 'http://localhost:8080';
      const ERROR_MESSAGE = 'Erreur de connexion au back-end. Les nouvelles données seront tentées à nouveau dans 3 secondes.';
      const MAX_POINTS = 30;

      const tempChart = new Chart(document.getElementById('temp-chart'), {
        type: 'line',
        data: { labels: [], datasets: [{ label: 'Température', data: [], borderColor: '#f94144', backgroundColor: 'rgba(249, 65, 68, 0.15)', fill: false, tension: 0.2 }] },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          scales: {
            x: { title: { display: true, text: 'Temps' } },
            y: { title: { display: true, text: 'Température' }, suggestedMin: 0, suggestedMax: 40 }
          }
        }
      });

      const humChart = new Chart(document.getElementById('hum-chart'), {
        type: 'line',
        data: { labels: [], datasets: [{ label: 'Humidité', data: [], borderColor: '#277da1', backgroundColor: 'rgba(39, 125, 161, 0.15)', fill: false, tension: 0.2 }] },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          scales: {
            x: { title: { display: true, text: 'Temps' } },
            y: { title: { display: true, text: 'Humidité' }, suggestedMin: 0, suggestedMax: 100 }
          }
        }
      });

      function showError(message) {
        const errorBox = document.getElementById('error');
        errorBox.textContent = message;
        errorBox.style.display = 'block';
      }

      function clearError() {
        document.getElementById('error').style.display = 'none';
      }

      function updateTable(targetId, data) {
        const tbody = document.getElementById(targetId);
        tbody.innerHTML = '';

        data.forEach(([timestamp, value]) => {
          const row = document.createElement('tr');
          const tsCell = document.createElement('td');
          const valueCell = document.createElement('td');
          tsCell.textContent = timestamp;
          valueCell.textContent = value;
          row.appendChild(tsCell);
          row.appendChild(valueCell);
          tbody.appendChild(row);
        });
      }

      function updateChart(chart, labels, values, label) {
        chart.data.labels = labels;
        chart.data.datasets[0].label = label;
        chart.data.datasets[0].data = values;
        chart.update();
      }

      async function fetchValue(url) {
        const response = await fetch(url);
        if (!response.ok) {
          throw new Error(`Erreur HTTP ${response.status}`);
        }
        const contentType = response.headers.get('content-type') || '';
        if (contentType.includes('application/json')) {
          return response.json();
        }
        return Number.parseFloat(await response.text());
      }

      async function fetchJson(url) {
        const response = await fetch(url);
        if (!response.ok) {
          throw new Error(`Erreur HTTP ${response.status}`);
        }
        return response.json();
      }

      async function refreshData() {
        try {
          clearError();

          const tempCurrent = await fetchValue(`${BACKEND}/capteurs/temp`);
          const tempAverage = await fetchValue(`${BACKEND}/capteurs/temp/30/moy`);
          const tempHistory = await fetchJson(`${BACKEND}/capteurs/temp/30`);

          const humCurrent = await fetchValue(`${BACKEND}/capteurs/hum`);
          const humAverage = await fetchValue(`${BACKEND}/capteurs/hum/30/moy`);
          const humHistory = await fetchJson(`${BACKEND}/capteurs/hum/30`);

          document.getElementById('temp-current').textContent = `${tempCurrent}°C`;
          document.getElementById('temp-average').textContent = `${tempAverage}°C`;
          updateTable('temp-history', tempHistory);
          updateChart(tempChart, tempHistory.map(([timestamp]) => timestamp.split(' ')[1]), tempHistory.map(([, value]) => value), 'Température');

          document.getElementById('hum-current').textContent = `${humCurrent}%`;
          document.getElementById('hum-average').textContent = `${humAverage}%`;
          updateTable('hum-history', humHistory);
          updateChart(humChart, humHistory.map(([timestamp]) => timestamp.split(' ')[1]), humHistory.map(([, value]) => value), 'Humidité');
        } catch (error) {
          showError(ERROR_MESSAGE);
          console.error(error);
        }
      }

      refreshData();
      setInterval(refreshData, 3000);
    </script>
  </body>
</html>
